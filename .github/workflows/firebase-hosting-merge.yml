# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          NEXT_TELEMETRY_DISABLED: "1"
          TURBOPACK: "0"
      - name: Authenticate Firebase CLI
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAPERWORKING_97055 }}' > sa.json

      - name: Firebase CLI diagnostics
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: |
          npx -y firebase-tools@latest --version
          npx -y firebase-tools@latest use
          npx -y firebase-tools@latest projects:list
          echo "Configured storage bucket: paperworking-97055.firebasestorage.app (array format in firebase.json)"

      - name: Deploy Firebase Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: npx -y firebase-tools@latest deploy --only firestore,storage

      - name: Remove service account key
        if: always()
        run: rm -f sa.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAPERWORKING_97055 }}
          channelId: live
          projectId: paperworking-97055
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

