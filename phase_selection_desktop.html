<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;family=Hanken+Grotesk:wght@300;400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card-selected {
            background: linear-gradient(135deg, rgba(87, 241, 219, 0.1) 0%, rgba(87, 241, 219, 0.03) 100%);
            backdrop-filter: blur(24px);
            border: 2px solid #57f1db;
            box-shadow: 0 0 20px rgba(87, 241, 219, 0.15);
        }
        .luminous-button {
            box-shadow: 0 0 20px -5px rgba(87, 241, 219, 0.5);
        }
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #0b141a;
        }
        .font-plus { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#57f1db",
                        "surface": "#0b141a",
                        "surface-container": "#182127",
                        "surface-container-low": "#141d23",
                        "on-surface": "#dae4ec",
                        "on-surface-variant": "#bacac5",
                        "outline": "#859490",
                        "tertiary": "#ffd1aa",
                        "secondary": "#adc6ff",
                    },
                    spacing: {
                        "unit": "8px",
                        "margin-desktop": "40px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                    },
                    fontSize: {
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                    }
                }
            }
        }
    </script>
</head>
<body class="text-on-surface antialiased overflow-hidden">
<!-- Background Dashboard (Blured/Obscured) -->
<div class="fixed inset-0 z-0 opacity-20 pointer-events-none">
<div class="grid grid-cols-12 h-full w-full p-margin-desktop gap-gutter-desktop">
<div class="col-span-3 bg-surface-container-low rounded-xl border border-white/5"></div>
<div class="col-span-9 space-y-stack-lg">
<div class="h-48 bg-surface-container-low rounded-xl border border-white/5"></div>
<div class="grid grid-cols-3 gap-gutter-desktop">
<div class="h-64 bg-surface-container-low rounded-xl border border-white/5"></div>
<div class="h-64 bg-surface-container-low rounded-xl border border-white/5"></div>
<div class="h-64 bg-surface-container-low rounded-xl border border-white/5"></div>
</div>
</div>
</div>
</div>
<!-- Overlay Backdrop -->
<div class="fixed inset-0 bg-surface/80 backdrop-blur-sm z-10"></div>
<!-- Main Modal Container -->
<main class="fixed inset-0 z-50 flex items-center justify-center p-6">
<div class="w-[720px] bg-surface-container rounded-2xl border border-white/10 shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Progress Bar -->
<div class="grid grid-cols-5 h-1 gap-1 px-1 pt-1">
<div class="bg-primary/40 rounded-full h-full"></div>
<div class="bg-primary rounded-full h-full ring-2 ring-primary ring-offset-2 ring-offset-surface-container"></div>
<div class="bg-white/10 rounded-full h-full"></div>
<div class="bg-white/10 rounded-full h-full"></div>
<div class="bg-white/10 rounded-full h-full"></div>
</div>
<!-- Header Content -->
<div class="px-10 pt-10 pb-6 text-center">
<div class="inline-flex items-center space-x-2 mb-4">
<span class="font-mono text-label-sm text-primary tracking-widest uppercase">Step 02</span>
<span class="w-8 h-[1px] bg-primary/30"></span>
<span class="font-mono text-label-sm text-on-surface-variant">Lifecycle Selection</span>
</div>
<h2 class="font-plus text-headline-md text-white mb-3">Where are you in this Project's lifecycle?</h2>
<p class="text-body-md text-on-surface-variant max-w-lg mx-auto">
                    Pick the phase that matches today. You'll move the Project forward as it progresses — including back into the past for deals you've already completed.
                </p>
</div>
<!-- Selection Grid -->
<div class="px-10 py-6 grid grid-cols-2 gap-4 flex-grow overflow-y-auto">
<!-- Card 1: Acquisition -->
<button class="glass-card group p-6 rounded-xl text-left transition-all hover:bg-white/5 hover:scale-[1.02] border-white/10 relative overflow-hidden flex flex-col justify-between h-44">
<div>
<div class="flex items-center justify-between mb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">query_stats</span>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
</div>
<h3 class="font-plus font-bold text-lg text-white mb-1">Acquisition</h3>
<p class="text-xs text-on-surface-variant leading-relaxed">I'm evaluating this property.</p>
</div>
<div class="mt-auto">
<span class="font-mono text-[10px] uppercase tracking-tighter text-primary/60 border border-primary/20 px-2 py-0.5 rounded">Run the numbers before you commit</span>
</div>
</button>
<!-- Card 2: Purchase -->
<button class="glass-card group p-6 rounded-xl text-left transition-all hover:bg-white/5 hover:scale-[1.02] border-white/10 flex flex-col justify-between h-44">
<div>
<div class="flex items-center justify-between mb-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
<h3 class="font-plus font-bold text-lg text-white mb-1">Purchase</h3>
<p class="text-xs text-on-surface-variant leading-relaxed">I'm in the middle of buying it.</p>
</div>
<div class="mt-auto">
<span class="font-mono text-[10px] uppercase tracking-tighter text-secondary/60 border border-secondary/20 px-2 py-0.5 rounded">Track financing and diligence</span>
</div>
</button>
<!-- Card 3: Hold (Selected) -->
<button class="glass-card-selected group p-6 rounded-xl text-left transition-all scale-[1.02] relative flex flex-col justify-between h-44">
<div class="absolute top-4 right-4 bg-primary text-surface rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
<div>
<div class="flex items-center justify-between mb-3">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">home_work</span>
</div>
<h3 class="font-plus font-bold text-lg text-white mb-1">Hold</h3>
<p class="text-xs text-on-surface-variant leading-relaxed">I already own it.</p>
</div>
<div class="mt-auto">
<span class="font-mono text-[10px] uppercase tracking-tighter text-tertiary border border-tertiary/40 px-2 py-0.5 rounded">Track operations and rehab</span>
</div>
</button>
<!-- Card 4: Exit or Rent -->
<button class="glass-card group p-6 rounded-xl text-left transition-all hover:bg-white/5 hover:scale-[1.02] border-white/10 flex flex-col justify-between h-44">
<div>
<div class="flex items-center justify-between mb-3">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">sell</span>
</div>
<h3 class="font-plus font-bold text-lg text-white mb-1">Exit or Rent</h3>
<p class="text-xs text-on-surface-variant leading-relaxed">I'm selling, refinancing, or stabilizing.</p>
</div>
<div class="mt-auto">
<span class="font-mono text-[10px] uppercase tracking-tighter text-outline/60 border border-outline/20 px-2 py-0.5 rounded">Review realized numbers</span>
</div>
</button>
</div>
<!-- Footer Actions -->
<div class="px-10 py-8 flex items-center justify-between border-t border-white/5 bg-surface-container-highest/30">
<button class="text-on-surface-variant hover:text-white transition-colors flex items-center group font-plus font-medium">
<span class="material-symbols-outlined mr-2 text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Back
                </button>
<button class="luminous-button bg-primary text-on-primary hover:brightness-110 active:scale-95 transition-all px-8 py-3 rounded-lg flex items-center font-plus font-bold">
                    Continue
                    <span class="material-symbols-outlined ml-2 text-lg">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Interactive script for visual micro-interactions -->
<script>
        // Simple logic for card selection styling toggle (simulation)
        const cards = document.querySelectorAll('.glass-card, .glass-card-selected');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                cards.forEach(c => {
                    c.classList.remove('glass-card-selected', 'scale-[1.02]');
                    c.classList.add('glass-card');
                    // Remove checkmark if exists
                    const check = c.querySelector('.absolute.top-4.right-4');
                    if (check) check.remove();
                });
                
                card.classList.remove('glass-card');
                card.classList.add('glass-card-selected', 'scale-[1.02]');
                
                // Add checkmark
                const checkHTML = `
                    <div class="absolute top-4 right-4 bg-primary text-surface rounded-full p-0.5 flex items-center justify-center animate-in zoom-in duration-200">
                        <span class="material-symbols-outlined text-sm font-bold">check</span>
                    </div>
                `;
                card.insertAdjacentHTML('beforeend', checkHTML);
            });
        });
    </script>
</body></html>
