name: Verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify git-ignore coverage
        run: npm run check:gitignore

      - name: Run verify gate
        run: npm run verify

      - name: Runtime smoke (route matrix)
        run: |
          PORT=3000 npm --prefix apps/web run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break || sleep 2
          done
          node scripts/smoke-prod.mjs
