# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
#
# Monorepo: root npm run build builds packages → api → web in order
# (do not use npm run build --workspaces — parallel builds break workspace deps).
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  # Use shell script — App Hosting often breaks `npm --workspace=` ("No workspaces found").
  # Firebase console "Root directory" must be repository root (.), not apps/web.
  # Call the shell script directly — `npm run apphosting:build` can recurse when the
  # App Hosting buildpack also registers an apphosting:build npm lifecycle hook.
  buildCommand: bash scripts/apphosting-build.sh
  runCommand: npm --prefix apps/web run start

# Environment variables and secrets.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
env:
  # ─── Build config ──────────────────────────────────────────────────────────
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=8192"
    availability:
      - BUILD

  # ─── Firebase client SDK (public — already in browser bundle) ──────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDlmH8L2s9_IXXKUx9DIhhWP4nMYDzUlvg"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "paperworking-97055.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "paperworking-97055"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "paperworking-97055.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "779101817926"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:779101817926:web:0dfce37fddc70718e70e47"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-7JX7B7KF0D"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FACEBOOK_APP_ID
    value: "846487651808178"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    value: "https://paperworking.co"
    availability:
      - BUILD
      - RUNTIME

  # Nest Cloud Run base URL for browser apiFetch (no trailing slash).
  # NEXT_PUBLIC_* is inlined at `next build` — MUST be available at BUILD time.
  # Create Secret Manager secret NEXT_PUBLIC_API_URL with the Cloud Run HTTPS URL
  # (e.g. output of scripts/deploy-api-cloud-run.sh) before App Hosting build.
  - variable: NEXT_PUBLIC_API_URL
    secret: NEXT_PUBLIC_API_URL
    availability:
      - BUILD
      - RUNTIME

  # ─── Auth (V0 parity — Firebase Google/Facebook popup) ───────────────────
  - variable: USE_FIREBASE_AUTH
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_USE_FIREBASE_AUTH
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # ─── Firebase Admin SDK (server-side) ──────────────────────────────────────
  - variable: FIREBASE_PROJECT_ID
    value: "paperworking-97055"
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
